<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>T&C Radar — Settings</title>
  <style>
    body { font: 14px/1.6 -apple-system, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
    h1 { font-size: 20px; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    input[type="password"], input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 20px; padding: 10px 20px; border-radius: 6px; border: none; background: #175cd3; color: #fff; cursor: pointer; }
    #msg { margin-top: 12px; color: #067647; }
    .hint { font-size: 12px; color: #666; font-weight: 400; }
  </style>
</head>
<body>
  <h1>⚖️ T&C Radar — Settings</h1>

  <label>
    DeepSeek API key
    <input type="password" id="apiKey" placeholder="sk-...">
    <span class="hint">Get one at platform.deepseek.com. Stored locally in Chrome sync storage.</span>
  </label>

  <label>
    Model
    <input type="text" id="model" placeholder="deepseek-flash">
    <span class="hint">Default: deepseek-v4.1-flash</span>
  </label>

  <label>
    <input type="checkbox" id="autoScan" checked> Auto-scan terms pages on visit
  </label>

  <button id="save">Save</button>
  <div id="msg"></div>

  <script src="options.js"></script>
</body>
</html>
